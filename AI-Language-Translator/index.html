<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Language Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2> 🌐 Universal AI Language Translator</h2>
            <p>Accurate translations for 100+ languages worldwide</p>
            <div class="translator-icon">🌐</div>
        </div>
        
        <div class="content">
            <div class="input-group">
                <textarea id="inputText" placeholder="Enter text to translate..."></textarea>
            </div>
            
            <div class="language-selectors">
                <div class="language-selector">
                    <label for="sourceLang">From:</label>
                    <select id="sourceLang">
                        <option value="auto">Detect Language</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="zh">Chinese</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                        <option value="bn">Bengali</option>
                        <option value="pa">Punjabi</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="mr">Marathi</option>
                        <option value="gu">Gujarati</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="or">Odia</option>
                        <option value="as">Assamese</option>
                        <option value="ur">Urdu</option>
                        <!-- Add more languages as needed -->
                    </select>
                </div>
                
                <div class="language-selector">
                    <label for="targetLang">To:</label>
                    <select id="targetLang">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="zh">Chinese</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                        <option value="bn">Bengali</option>
                        <option value="pa">Punjabi</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="mr">Marathi</option>
                        <option value="gu">Gujarati</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="or">Odia</option>
                        <option value="as">Assamese</option>
                        <option value="ur">Urdu</option>
                        <!-- Add more languages as needed -->
                    </select>
                </div>
            </div>
            
            <div class="button-group">
                <button id="translateBtn">
                    <span>Translate</span>
                    <span>→</span>
                </button>
                <button id="clearBtn">
                    <span>Clear</span>
                    <span>×</span>
                </button>
            </div>
            
            <div class="loading" id="loadingIndicator">
                <div class="loading-spinner"></div>
                <p>Translating...</p>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            
            <div class="output-container">
                <h3>
                    <span>Translation Result</span>
                    <span>📝</span>
                </h3>
                <p id="outputText">Your translation will appear here...</p>
                <div id="translationDetails" style="margin-top: 15px; font-size: 0.9rem; color: #666;"></div>
            </div>
            <div class="footer" style="text-align: right; margin-top: 30px;">Made with 💡 by Valipe Harshitha</div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
